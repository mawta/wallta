server {
    listen 80;
    listen [::]:80;
    server_name wallta.mawta.store;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/wallta-certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wallta.mawta.store;
    root /srv/wallta-site/public;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/wallta.mawta.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wallta.mawta.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
