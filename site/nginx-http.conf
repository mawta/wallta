server {
    listen 80;
    listen [::]:80;
    server_name wallta.mawta.store;
    root /srv/wallta-site/public;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/wallta-certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
