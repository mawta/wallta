[package]
name = "wallta"
version = "0.1.7"
description = "Wallta wallpaper rotation"
authors = ["Wallta"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "wallta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2"
quick-xml = "0.37"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
rfd = "0.15"
open = "5"

[target.'cfg(windows)'.dependencies]
tauri-plugin-updater = "=2.14.0"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
winreg = "0.55"
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

[dependencies.if-addrs]
version = "0.13"
